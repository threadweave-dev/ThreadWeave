name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    environment: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: threadweave-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: threadweave-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: threadweave-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Update ThreadWeave protocols
        run: cargo update --package threadweave-protocols

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/${{ matrix.archive }}" \
            threadweave

      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/threadweave.exe" `
            -DestinationPath "dist/${{ matrix.archive }}"

      - name: Store the release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  publish-crate:
    name: Publish ThreadWeave to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Update ThreadWeave protocols
        run: cargo update --package threadweave-protocols

      - name: Verify crate version matches the tag
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml (v${version})"
            exit 1
          fi

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
