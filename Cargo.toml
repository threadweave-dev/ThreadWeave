[package]
name = "threadweave"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "A resource-oriented distributed execution engine for modern workloads"
repository = "https://github.com/threadweave-dev/ThreadWeave"
homepage = "https://github.com/threadweave-dev/ThreadWeave"
readme = "README.md"
keywords = ["distributed", "scheduler", "execution", "runtime"]
categories = ["concurrency", "command-line-utilities"]
publish = ["crates-io"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
